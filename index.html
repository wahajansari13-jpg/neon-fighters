<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Fighters – Choose Your Warrior</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: #07070f;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      max-height: 600px;
      background: #0a0a14;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(0, 255, 200, 0.12);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========== SCREENS ========== */
    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: all 0.4s ease;
      background: radial-gradient(ellipse at center, #12081f 0%, #07070f 70%);
    }

    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
    }

    /* SELECT SCREEN */
    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.6rem;
      font-weight: 900;
      background: linear-gradient(90deg, #00ffcc, #ff00aa, #00ccff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 4s linear infinite;
      margin-bottom: 4px;
      letter-spacing: 3px;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    .subtitle {
      font-size: 1rem;
      color: #888;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .chars-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 95%;
      max-width: 820px;
      max-height: 340px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 18px;
    }

    .char-card {
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.22s ease;
      position: relative;
    }

    .char-card:hover {
      transform: translateY(-3px);
      border-color: rgba(0,255,200,0.5);
      box-shadow: 0 6px 20px rgba(0,255,200,0.15);
    }

    .char-card.selected {
      border-color: #00ffcc;
      background: rgba(0,255,200,0.12);
      box-shadow: 0 0 22px rgba(0,255,200,0.3);
    }

    .char-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #000;
    }

    .char-name {
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .char-stats {
      font-size: 0.7rem;
      color: #777;
    }

    .start-btn {
      background: linear-gradient(90deg, #00ffcc, #00aaff);
      border: none;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      padding: 14px 42px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(0,255,200,0.4);
      transition: all 0.25s;
      text-transform: uppercase;
    }

    .start-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(0,255,200,0.65);
    }

    .start-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* HUD during fight */
    #fight-hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 15;
      pointer-events: none;
    }

    .fighter-hud {
      width: 42%;
      max-width: 280px;
    }

    .fighter-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-shadow: 0 0 8px currentColor;
    }

    .health-bar-bg {
      height: 14px;
      background: rgba(0,0,0,0.6);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      overflow: hidden;
    }

    .health-bar {
      height: 100%;
      border-radius: 7px;
      transition: width 0.2s ease;
    }

    .vs-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      margin-top: 8px;
    }

    /* Mobile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 25;
      pointer-events: none;
    }

    .ctrl-group {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 58px;
      height: 58px;
      background: rgba(0,255,200,0.12);
      border: 2px solid rgba(0,255,200,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #00ffcc;
      backdrop-filter: blur(4px);
    }

    .ctrl-btn.attack {
      background: rgba(255,0,100,0.15);
      border-color: rgba(255,0,100,0.45);
      color: #ff3366;
    }

    /* Result Screen */
    #result-screen {
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(14px);
    }

    .result-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      margin-bottom: 12px;
      text-shadow: 0 0 25px currentColor;
    }

    .result-title.win { color: #00ffcc; }
    .result-title.lose { color: #ff0055; }

    .btn-row {
      display: flex;
      gap: 14px;
      margin-top: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.22s;
    }

    .btn-primary {
      background: linear-gradient(90deg, #00ffcc, #00aaff);
      color: #000;
    }

    .btn-secondary {
      background: transparent;
      border: 2px solid #ff00aa;
      color: #ff00aa;
    }

    .btn:hover { transform: scale(1.05); }

    /* Desktop hint */
    .desktop-hint {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: #555;
      z-index: 15;
      pointer-events: none;
    }

    @media (max-width: 700px) {
      #game-container { max-height: 100vh; }
      .logo { font-size: 1.9rem; }
      .chars-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 300px; }
      #mobile-controls { display: flex; }
      .desktop-hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- CHARACTER SELECT -->
    <div id="select-screen" class="screen">
      <div class="logo">NEON FIGHTERS</div>
      <div class="subtitle">Select Your Warrior</div>
      <div class="chars-grid" id="charsGrid"></div>
      <button class="start-btn" id="startBtn" disabled>CHOOSE A FIGHTER</button>
    </div>

    <!-- FIGHT HUD -->
    <div id="fight-hud" class="hidden">
      <div class="fighter-hud" style="text-align:left">
        <div class="fighter-name" id="pName" style="color:#00ffcc">PLAYER</div>
        <div class="health-bar-bg">
          <div class="health-bar" id="pHealth" style="width:100%; background:linear-gradient(90deg,#00ffcc,#00aaff)"></div>
        </div>
      </div>
      <div class="vs-text">VS</div>
      <div class="fighter-hud" style="text-align:right">
        <div class="fighter-name" id="eName" style="color:#ff3366">ENEMY</div>
        <div class="health-bar-bg">
          <div class="health-bar" id="eHealth" style="width:100%; background:linear-gradient(90deg,#ff3366,#ff0055)"></div>
        </div>
      </div>
    </div>

    <!-- MOBILE CONTROLS -->
    <div id="mobile-controls">
      <div class="ctrl-group">
        <div class="ctrl-btn" id="btnLeft">◀</div>
        <div class="ctrl-btn" id="btnRight">▶</div>
      </div>
      <div class="ctrl-group">
        <div class="ctrl-btn attack" id="btnPunch">PUNCH</div>
        <div class="ctrl-btn attack" id="btnKick">KICK</div>
        <div class="ctrl-btn attack" id="btnSpecial">SP</div>
      </div>
    </div>

    <div class="desktop-hint">A/D or ← → Move | J Punch | K Kick | L Special | Space Block</div>

    <!-- RESULT -->
    <div id="result-screen" class="screen hidden">
      <div class="result-title" id="resultTitle">YOU WIN!</div>
      <div id="resultText" style="font-size:1.2rem; color:#aaa; margin-bottom:8px"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="retryBtn">FIGHT AGAIN</button>
        <button class="btn btn-secondary" id="menuBtn">CHANGE FIGHTER</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== 20 CHARACTERS ====================
    const CHARACTERS = [
      { id:0,  name:"Blaze",    color:"#ff4400", accent:"#ff8800", emoji:"🔥", power:1.1, speed:1.0, defense:0.9 },
      { id:1,  name:"Frost",    color:"#00ccff", accent:"#66eeff", emoji:"❄️", power:0.95, speed:1.05, defense:1.1 },
      { id:2,  name:"Volt",     color:"#ffff00", accent:"#ffee44", emoji:"⚡", power:1.05, speed:1.15, defense:0.85 },
      { id:3,  name:"Shadow",   color:"#aa00ff", accent:"#cc66ff", emoji:"🌑", power:1.0,  speed:1.1,  defense:1.0 },
      { id:4,  name:"Venom",    color:"#33ff00", accent:"#88ff44", emoji:"☠️", power:1.15, speed:0.95, defense:0.95 },
      { id:5,  name:"Crimson",  color:"#ff0044", accent:"#ff3366", emoji:"🩸", power:1.2,  speed:0.9,  defense:0.9 },
      { id:6,  name:"Aqua",     color:"#00aaff", accent:"#44ccff", emoji:"💧", power:0.9,  speed:1.1,  defense:1.15 },
      { id:7,  name:"Solar",    color:"#ffaa00", accent:"#ffcc44", emoji:"☀️", power:1.1,  speed:1.0,  defense:1.0 },
      { id:8,  name:"Nova",     color:"#ff00aa", accent:"#ff66cc", emoji:"💫", power:1.05, speed:1.05, defense:1.0 },
      { id:9,  name:"Titan",    color:"#888888", accent:"#bbbbbb", emoji:"🛡️", power:1.25, speed:0.8,  defense:1.2 },
      { id:10, name:"Phantom",  color:"#cc00ff", accent:"#ee66ff", emoji:"👻", power:0.95, speed:1.2,  defense:0.9 },
      { id:11, name:"Ember",    color:"#ff6622", accent:"#ff9944", emoji:"🌋", power:1.15, speed:0.95, defense:0.95 },
      { id:12, name:"Glitch",   color:"#00ff88", accent:"#44ffaa", emoji:"👾", power:1.0,  speed:1.15, defense:0.9 },
      { id:13, name:"Storm",    color:"#6688ff", accent:"#99aaff", emoji:"🌪️", power:1.05, speed:1.1,  defense:0.95 },
      { id:14, name:"Raven",    color:"#222222", accent:"#555555", emoji:"🦅", power:1.0,  speed:1.15, defense:1.0 },
      { id:15, name:"Jade",     color:"#00cc66", accent:"#44dd88", emoji:"🍃", power:0.95, speed:1.05, defense:1.1 },
      { id:16, name:"Ruby",     color:"#ff2266", accent:"#ff5588", emoji:"💎", power:1.1,  speed:1.0,  defense:1.05 },
      { id:17, name:"Cyber",    color:"#00ffcc", accent:"#44ffdd", emoji:"🤖", power:1.05, speed:1.1,  defense:1.0 },
      { id:18, name:"Inferno",  color:"#ff2200", accent:"#ff5500", emoji:"🔥", power:1.3,  speed:0.85, defense:0.85 },
      { id:19, name:"Zenith",   color:"#ffffff", accent:"#dddddd", emoji:"⭐", power:1.1,  speed:1.05, defense:1.05 },
    ];

    // ==================== STATE ====================
    let selectedChar = null;
    let canvas, ctx;
    let gameRunning = false;
    let player, enemy;
    let keys = {};
    let gameWidth, gameHeight;
    let lastTime = 0;
    let hitEffects = [];
    let roundOver = false;

    // ==================== INIT ====================
    function init() {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      resize();
      window.addEventListener('resize', resize);

      // Build character grid
      const grid = document.getElementById('charsGrid');
      CHARACTERS.forEach(c => {
        const card = document.createElement('div');
        card.className = 'char-card';
        card.dataset.id = c.id;
        card.innerHTML = `
          <div class="char-avatar" style="background:linear-gradient(135deg,${c.color},${c.accent})">${c.emoji}</div>
          <div class="char-name" style="color:${c.color}">${c.name}</div>
          <div class="char-stats">PWR ${Math.round(c.power*100)} • SPD ${Math.round(c.speed*100)}</div>
        `;
        card.addEventListener('click', () => selectChar(c.id));
        grid.appendChild(card);
      });

      document.getElementById('startBtn').addEventListener('click', startFight);
      document.getElementById('retryBtn').addEventListener('click', startFight);
      document.getElementById('menuBtn').addEventListener('click', showSelect);

      // Keyboard
      window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (['arrowleft','arrowright',' ','j','k','l','a','d'].includes(e.key.toLowerCase())) e.preventDefault();
      });
      window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
      });

      // Mobile buttons
      setupMobileBtn('btnLeft', 'arrowleft');
      setupMobileBtn('btnRight', 'arrowright');
      setupMobileBtn('btnPunch', 'j');
      setupMobileBtn('btnKick', 'k');
      setupMobileBtn('btnSpecial', 'l');
    }

    function setupMobileBtn(id, key) {
      const btn = document.getElementById(id);
      btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
      btn.addEventListener('mousedown', () => keys[key] = true);
      btn.addEventListener('mouseup', () => keys[key] = false);
      btn.addEventListener('mouseleave', () => keys[key] = false);
    }

    function resize() {
      const container = document.getElementById('game-container');
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      gameWidth = canvas.width;
      gameHeight = canvas.height;
    }

    function selectChar(id) {
      selectedChar = CHARACTERS.find(c => c.id === id);
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      document.querySelector(`.char-card[data-id="${id}"]`).classList.add('selected');
      const btn = document.getElementById('startBtn');
      btn.disabled = false;
      btn.textContent = `FIGHT AS ${selectedChar.name}`;
      btn.style.background = `linear-gradient(90deg, ${selectedChar.color}, ${selectedChar.accent})`;
    }

    function showSelect() {
      gameRunning = false;
      document.getElementById('select-screen').classList.remove('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('fight-hud').classList.add('hidden');
    }

    // ==================== FIGHT START ====================
    function startFight() {
      if (!selectedChar) return;

      // Player
      player = createFighter(selectedChar, true);

      // Random enemy (different from player)
      let enemyData;
      do {
        enemyData = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
      } while (enemyData.id === selectedChar.id);
      enemy = createFighter(enemyData, false);

      // Position
      player.x = gameWidth * 0.28;
      enemy.x = gameWidth * 0.72;
      player.y = enemy.y = gameHeight * 0.62;

      hitEffects = [];
      roundOver = false;

      document.getElementById('select-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('fight-hud').classList.remove('hidden');

      document.getElementById('pName').textContent = player.name;
      document.getElementById('pName').style.color = player.color;
      document.getElementById('eName').textContent = enemy.name;
      document.getElementById('eName').style.color = enemy.color;

      updateHealthBars();

      gameRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    function createFighter(data, isPlayer) {
      return {
        ...data,
        isPlayer,
        x: 0,
        y: 0,
        width: 50,
        height: 90,
        vx: 0,
        health: 100,
        maxHealth: 100,
        facing: isPlayer ? 1 : -1,
        state: 'idle',       // idle, punch, kick, special, hurt, block
        stateTimer: 0,
        attackCooldown: 0,
        block: false,
        combo: 0
      };
    }

    // ==================== GAME LOOP ====================
    function gameLoop(timestamp) {
      if (!gameRunning) return;
      const dt = Math.min((timestamp - lastTime) / 16.67, 2.5);
      lastTime = timestamp;

      if (!roundOver) {
        updatePlayer(dt);
        updateEnemy(dt);
        updateEffects(dt);
        checkAttacks();
        updateHealthBars();
      }

      draw();
      requestAnimationFrame(gameLoop);
    }

    // ==================== PLAYER ====================
    function updatePlayer(dt) {
      const f = player;
      f.attackCooldown = Math.max(0, f.attackCooldown - dt);
      f.stateTimer = Math.max(0, f.stateTimer - dt);

      // Movement
      let move = 0;
      if (keys['arrowleft'] || keys['a']) move = -1;
      if (keys['arrowright'] || keys['d']) move = 1;

      if (f.state === 'idle' || f.state === 'block') {
        f.vx = move * 4.2 * f.speed;
        f.facing = move !== 0 ? move : f.facing;
      } else {
        f.vx *= 0.7;
      }

      // Block
      f.block = (keys[' '] || keys['shift']) && (f.state === 'idle' || f.state === 'block');
      if (f.block) f.state = 'block';
      else if (f.state === 'block') f.state = 'idle';

      // Attacks
      if (f.attackCooldown <= 0 && !f.block) {
        if (keys['j']) startAttack(f, 'punch', 18);
        else if (keys['k']) startAttack(f, 'kick', 26);
        else if (keys['l']) startAttack(f, 'special', 38);
      }

      // State recovery
      if (f.stateTimer <= 0 && f.state !== 'idle' && f.state !== 'block') {
        f.state = 'idle';
      }

      // Apply movement
      f.x += f.vx * dt;
      f.x = Math.max(40, Math.min(gameWidth - 40, f.x));

      // Face enemy
      if (Math.abs(f.x - enemy.x) > 10) {
        f.facing = f.x < enemy.x ? 1 : -1;
      }
    }

    function startAttack(f, type, cooldown) {
      f.state = type;
      f.stateTimer = type === 'special' ? 22 : type === 'kick' ? 16 : 12;
      f.attackCooldown = cooldown / f.speed;
      f.combo++;
    }

    // ==================== ENEMY AI ====================
    function updateEnemy(dt) {
      const f = enemy;
      f.attackCooldown = Math.max(0, f.attackCooldown - dt);
      f.stateTimer = Math.max(0, f.stateTimer - dt);

      const dist = player.x - f.x;
      const absDist = Math.abs(dist);

      // Simple AI
      if (f.state === 'idle' || f.state === 'block') {
        if (absDist > 95) {
          // Approach
          f.vx = Math.sign(dist) * 3.4 * f.speed;
          f.facing = Math.sign(dist);
        } else if (absDist < 55) {
          // Back off a bit
          f.vx = -Math.sign(dist) * 2.2 * f.speed;
        } else {
          f.vx *= 0.8;
        }

        // Attack decision
        if (f.attackCooldown <= 0 && absDist < 110) {
          const r = Math.random();
          if (r < 0.35) startAttack(f, 'punch', 20);
          else if (r < 0.6) startAttack(f, 'kick', 28);
          else if (r < 0.72) startAttack(f, 'special', 42);
          else if (r < 0.85) {
            f.state = 'block';
            f.stateTimer = 25;
          }
        }
      } else {
        f.vx *= 0.65;
      }

      if (f.stateTimer <= 0 && f.state !== 'idle') f.state = 'idle';

      f.x += f.vx * dt;
      f.x = Math.max(40, Math.min(gameWidth - 40, f.x));

      if (Math.abs(f.x - player.x) > 10) {
        f.facing = f.x < player.x ? 1 : -1;
      }
    }

    // ==================== COMBAT ====================
    function checkAttacks() {
      // Player attacks enemy
      if (['punch','kick','special'].includes(player.state) && player.stateTimer > 4) {
        tryHit(player, enemy);
      }
      // Enemy attacks player
      if (['punch','kick','special'].includes(enemy.state) && enemy.stateTimer > 4) {
        tryHit(enemy, player);
      }
    }

    function tryHit(attacker, defender) {
      const dist = Math.abs(attacker.x - defender.x);
      const range = attacker.state === 'special' ? 130 : attacker.state === 'kick' ? 100 : 78;

      if (dist < range && Math.sign(defender.x - attacker.x) === attacker.facing) {
        // Already hit this attack?
        if (attacker._hitThisAttack) return;
        attacker._hitThisAttack = true;

        let damage = attacker.state === 'special' ? 22 : attacker.state === 'kick' ? 14 : 9;
        damage *= attacker.power;

        if (defender.block || defender.state === 'block') {
          damage *= 0.25 * (2 - defender.defense);
          spawnHitEffect(defender.x, defender.y - 30, '#aaaaaa');
        } else {
          damage *= (1.3 - defender.defense * 0.3);
          defender.state = 'hurt';
          defender.stateTimer = 14;
          defender.vx = attacker.facing * 6;
          spawnHitEffect(defender.x, defender.y - 40, attacker.color);
        }

        defender.health = Math.max(0, defender.health - damage);

        if (defender.health <= 0) {
          endRound(attacker.isPlayer);
        }
      }

      // Reset hit flag when attack ends
      if (attacker.stateTimer <= 1) attacker._hitThisAttack = false;
    }

    function spawnHitEffect(x, y, color) {
      for (let i = 0; i < 8; i++) {
        hitEffects.push({
          x, y,
          vx: (Math.random()-0.5)*10,
          vy: (Math.random()-0.5)*10,
          life: 18 + Math.random()*10,
          color
        });
      }
    }

    function updateEffects(dt) {
      for (let i = hitEffects.length-1; i >= 0; i--) {
        const p = hitEffects[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) hitEffects.splice(i, 1);
      }
    }

    function updateHealthBars() {
      document.getElementById('pHealth').style.width = player.health + '%';
      document.getElementById('eHealth').style.width = enemy.health + '%';
    }

    function endRound(playerWon) {
      roundOver = true;
      setTimeout(() => {
        gameRunning = false;
        const title = document.getElementById('resultTitle');
        const text = document.getElementById('resultText');
        if (playerWon) {
          title.textContent = 'YOU WIN!';
          title.className = 'result-title win';
          text.textContent = `${player.name} defeated ${enemy.name}`;
        } else {
          title.textContent = 'YOU LOSE';
          title.className = 'result-title lose';
          text.textContent = `${enemy.name} was too strong`;
        }
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('fight-hud').classList.add('hidden');
      }, 700);
    }

    // ==================== DRAW ====================
    function draw() {
      // Background
      const grad = ctx.createLinearGradient(0, 0, 0, gameHeight);
      grad.addColorStop(0, '#0d0221');
      grad.addColorStop(0.6, '#1a0a2e');
      grad.addColorStop(1, '#0a0a14');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, gameWidth, gameHeight);

      // Floor
      ctx.fillStyle = '#12121f';
      ctx.fillRect(0, gameHeight * 0.72, gameWidth, gameHeight * 0.28);

      // Floor line glow
      ctx.strokeStyle = selectedChar ? selectedChar.color : '#00ffcc';
      ctx.lineWidth = 3;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.moveTo(0, gameHeight * 0.72);
      ctx.lineTo(gameWidth, gameHeight * 0.72);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Grid on floor
      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 20; i++) {
        const x = (i / 20) * gameWidth;
        ctx.beginPath();
        ctx.moveTo(x, gameHeight * 0.72);
        ctx.lineTo(x, gameHeight);
        ctx.stroke();
      }

      // Draw fighters
      if (player) drawFighter(player);
      if (enemy) drawFighter(enemy);

      // Hit effects
      hitEffects.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 25);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawFighter(f) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.scale(f.facing, 1);

      const isAttacking = ['punch','kick','special'].includes(f.state);
      const isHurt = f.state === 'hurt';
      const isBlock = f.state === 'block';

      // Body glow
      ctx.shadowColor = f.color;
      ctx.shadowBlur = isAttacking ? 25 : 12;

      // Legs
      ctx.fillStyle = f.accent;
      ctx.fillRect(-12, 25, 9, 38);
      ctx.fillRect(4, 25, 9, 38);

      // Body
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.roundRect(-18, -25, 36, 55, 8);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(0, -42, 18, 0, Math.PI*2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#fff';
      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-6, -45, 4, 0, Math.PI*2);
      ctx.arc(6, -45, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-5, -45, 2, 0, Math.PI*2);
      ctx.arc(7, -45, 2, 0, Math.PI*2);
      ctx.fill();

      // Arms / Attacks
      ctx.fillStyle = f.accent;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = isAttacking ? 20 : 8;

      if (f.state === 'punch') {
        // Extended arm
        ctx.fillRect(10, -15, 42, 11);
        ctx.beginPath();
        ctx.arc(52, -9, 9, 0, Math.PI*2);
        ctx.fill();
      } else if (f.state === 'kick') {
        // Leg kick
        ctx.fillRect(8, 20, 48, 12);
      } else if (f.state === 'special') {
        // Both arms + energy
        ctx.fillRect(10, -20, 38, 10);
        ctx.fillRect(10, -5, 38, 10);
        ctx.fillStyle = f.color;
        ctx.globalAlpha = 0.6;
        ctx.beginPath();
        ctx.arc(55, -10, 22, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      } else if (isBlock) {
        // Arms crossed
        ctx.fillRect(-8, -18, 14, 28);
        ctx.fillRect(2, -18, 14, 28);
      } else {
        // Normal arms
        ctx.fillRect(-22, -12, 10, 28);
        ctx.fillRect(12, -12, 10, 28);
      }

      // Hurt flash
      if (isHurt) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.roundRect(-18, -25, 36, 55, 8);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.restore();

      // Name tag
      ctx.font = 'bold 13px Rajdhani';
      ctx.fillStyle = f.color;
      ctx.textAlign = 'center';
      ctx.fillText(f.name, f.x, f.y - 75);
    }

    // roundRect polyfill
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
      };
    }

    // START
    init();
  </script>
</body>
</html>
